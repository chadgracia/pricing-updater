name: Secret Guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block secrets and env-var dumps (this repo and its logs are PUBLIC)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 .github/scripts/secret_guard.py --range "$BEFORE...$AFTER"
          else
            python3 .github/scripts/secret_guard.py --range "HEAD~1...HEAD" 2>/dev/null || python3 .github/scripts/secret_guard.py --tree
          fi
