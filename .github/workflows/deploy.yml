name: Deploy Lambda

# Auto-deploy the price-updater Lambda whenever lambda_function.py lands on main.
on:
  push:
    branches: [main]
    paths:
      - lambda_function.py
      - .github/workflows/deploy.yml
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Tune these to match your AWS setup.
env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: price-updater

permissions:
  contents: read

concurrency:
  group: deploy-lambda
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Package function
        run: |
          # boto3 / urllib / stdlib only — no third-party deps to vendor,
          # so a flat zip of the handler is all the Lambda runtime needs.
          zip -j function.zip lambda_function.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://function.zip \
            --publish

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"
